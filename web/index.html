<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Todai - AI-powered Todo Management">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Todai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Todai</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Aggressive iOS swipe back gesture prevention */
    * {
      -webkit-overflow-scrolling: auto !important;
    }
    
    html {
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: auto;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFE;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: auto;
      touch-action: pan-y pinch-zoom;
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    /* Flutter container */
    flt-glass-pane {
      touch-action: pan-y pinch-zoom !important;
    }
    
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #9B9B9B;
    }
    
    .loading-text {
      font-size: 32px;
      font-weight: 200;
      letter-spacing: 2px;
      color: #2D2D2D;
      margin-bottom: 8px;
    }
    
    .loading-subtitle {
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-text">todai</div>
    <div class="loading-subtitle">loading...</div>
  </div>
  
  <script>
    // Aggressive iOS Safari/PWA swipe back prevention
    (function() {
      var startX = 0;
      var startY = 0;
      var isEdgeSwipe = false;
      
      // Prevent touchstart at edges
      document.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        var screenWidth = window.innerWidth;
        
        // Mark if starting from edge (expanded to 50px for better coverage)
        isEdgeSwipe = (startX < 50 || startX > screenWidth - 50);
      }, { passive: true });
      
      // Prevent touchmove for edge swipes
      document.addEventListener('touchmove', function(e) {
        if (!isEdgeSwipe) return;
        
        var deltaX = e.touches[0].clientX - startX;
        var deltaY = e.touches[0].clientY - startY;
        
        // Block horizontal swipe from edges
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 5) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, { passive: false });
      
      document.addEventListener('touchend', function() {
        isEdgeSwipe = false;
      }, { passive: true });
      
      // Aggressive history manipulation to prevent back navigation
      // Push multiple history states to create a buffer
      for (var i = 0; i < 3; i++) {
        history.pushState({ page: i }, '', location.href);
      }
      
      window.addEventListener('popstate', function(e) {
        // Always push back to prevent going to loading screen
        history.pushState({ page: 'app' }, '', location.href);
      });
      
      // Also intercept beforeunload as additional protection
      window.addEventListener('beforeunload', function(e) {
        // Push state before potential navigation
        history.pushState({ page: 'app' }, '', location.href);
      });
      
      // Prevent gesture navigation via navigation API if available
      if ('navigation' in window) {
        window.navigation.addEventListener('navigate', function(e) {
          // Block back/forward navigation
          if (e.navigationType === 'traverse') {
            e.preventDefault();
          }
        });
      }
    })();
    
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });
  </script>
  
  <script>
    // Unregister ALL service workers before loading Flutter
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            registration.unregister().then(function() {
              console.log('Service worker unregistered');
            });
          });
        });
        // Clear caches too
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              caches.delete(name);
            });
          });
        }
      }
    })();
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
