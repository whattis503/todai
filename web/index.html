<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Todai - AI-powered Todo Management">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Todai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Todai</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Disable iOS swipe back gesture */
    html, body {
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFE;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #9B9B9B;
    }
    
    .loading-text {
      font-size: 32px;
      font-weight: 200;
      letter-spacing: 2px;
      color: #2D2D2D;
      margin-bottom: 8px;
    }
    
    .loading-subtitle {
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-text">todai</div>
    <div class="loading-subtitle">loading...</div>
  </div>
  
  <script>
    // Disable browser back/forward swipe gestures
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.go(1);
    };
    
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });
  </script>
  
  <script>
    // Unregister ALL service workers before loading Flutter
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            registration.unregister().then(function() {
              console.log('Service worker unregistered');
            });
          });
        });
        // Clear caches too
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              caches.delete(name);
            });
          });
        }
      }
    })();
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
